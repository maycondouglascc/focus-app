name: Build Windows (Electron)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'resources/win32/**'
      - 'assets/**'
      - 'forge.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-windows.yml'

jobs:
  build-win32:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & unit tests
        run: |
          npm run typecheck
          npm test

      - name: Build Windows installer & portable ZIP
        run: npm run make:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: focus-win32-x64
          path: |
            out/make/squirrel.windows/x64/Focus-Setup.exe
            out/make/zip/win32/x64/*.zip
          if-no-files-found: error
