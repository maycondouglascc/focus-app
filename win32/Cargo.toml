[package]
name = "focus"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
windows-numerics = "0.3"
taffy = { version = "0.9", default-features = false, features = ["std", "taffy_tree", "flexbox", "content_size"] }
serde_json = "1.0.154"
accesskit = "0.25"
accesskit_windows = "0.35"
windows = { version = "0.62", features = ["UI_ViewManagement", "Win32_Foundation", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_WindowsProgramming", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_Graphics_Dwm", "Win32_UI_Controls", "Win32_UI_Controls_RichEdit", "Win32_UI_HiDpi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectComposition", "Win32_Graphics_DirectWrite"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
