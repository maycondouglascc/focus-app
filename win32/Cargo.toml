[package]
name = "focus"
version = "0.0.1"
edition = "2021"
publish = false

[dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Threading", "Win32_System_Console"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
